name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # WoW's interpreter is Lua 5.1-based — lint on the same version.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck . --codes

  busted:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # This addon is all WoW-API code with no pure-Lua specs yet. Run busted
      # only if specs are ever added (a .busted file or any spec/ dir), so the
      # job stays green meanwhile and starts testing automatically once they exist.
      - name: Detect specs
        id: specs
        run: |
          if [ -f .busted ] || find . -path '*/spec/*' -name '*.lua' -print -quit | grep -q .; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No busted specs found — skipping unit tests."
          fi

      - uses: leafo/gh-actions-lua@v10
        if: steps.specs.outputs.have == 'true'
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4
        if: steps.specs.outputs.have == 'true'

      - name: Install busted
        if: steps.specs.outputs.have == 'true'
        run: luarocks install busted

      - name: Run unit tests
        if: steps.specs.outputs.have == 'true'
        run: busted --output=utfTerminal
